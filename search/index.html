<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>search.</title>
  <meta name="description" content="search. — find anything across the hub apps">
  <link rel="icon" href="/lifeos/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/lifeos/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="search.">
  <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1e1a" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="https://dannywebb014.github.io/lifeos/fonts.css">
  <script type="module">
    // One sign-in for every hub app (lifeos/auth.js): no verified session, off to /lifeos/signin/.
    import { requireAuth } from "/lifeos/auth.js";
    await requireAuth();
  </script>
  <style>
    /* lifeOS. tokens; each result takes its app's colour */
    :root {
      --bg:#f4f1ea; --surface:#fffdf8; --input:#f0ece3; --hover:#f9f6ef; --line:#e5dfd0; --line-strong:#ddd8cc;
      --text:#2c2218; --muted:#6b6055; --dim:#a8a295; --danger:#b54e4e;
      --logo:#5a4fa0; --accent:#7d6fd6; --mark:#7d6fd630;
      --food:#3d6b3d; --places:#b8436d; --motivation:#3d6ba8; --media:#8a6a12; --tasks:#2f8a84; --wish:#c4475a; --week:#5a4fa0;
      --shadow:0 1px 3px rgba(44,34,24,.06); --glow:.24;
      --disp:var(--hub-head, 'Lora', Georgia, serif);
      --body:var(--hub-body, 'Source Sans 3', system-ui, -apple-system, sans-serif);
      color-scheme:light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:#1a1e1a; --surface:#232823; --input:#2e342e; --hover:#2a302a; --line:#3a423a; --line-strong:#434b43;
        --text:#ebe8de; --muted:#a8a89c; --dim:#6b7568; --danger:#c96b6b;
        --logo:#c9c1ff; --accent:#b4a9ff; --mark:#b4a9ff38;
        --food:#9fc89f; --places:#f0a8c4; --motivation:#9fc0e0; --media:#ecd27a; --tasks:#8fd0c9; --wish:#f2a7b0; --week:#c9c1ff;
        --shadow:0 1px 4px rgba(0,0,0,.35); --glow:.18;
        color-scheme:dark;
      }
    }
    *, *::before, *::after { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:var(--body); font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased;
      padding:calc(20px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom)); }
    input { font:inherit; color:inherit; }
    .glow { position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
    .glow::before, .glow::after { content:""; position:absolute; width:80vmax; height:80vmax; border-radius:50%; opacity:var(--glow); animation:drift 18s ease-in-out infinite alternate; }
    .glow::before { left:-40vmax; top:-30vmax; background:radial-gradient(circle, var(--accent) 0%, transparent 62%); }
    .glow::after { right:-45vmax; bottom:-40vmax; background:radial-gradient(circle, var(--tasks) 0%, transparent 62%); animation-duration:23s; animation-direction:alternate-reverse; }
    @keyframes drift { to { transform:translate(12vmax, 10vmax) scale(1.15); } }
    @media (prefers-reduced-motion: reduce) { .glow::before, .glow::after { animation:none; } }

    main { position:relative; z-index:1; max-width:720px; margin:0 auto; display:grid; gap:14px; }
    .logo { font-family:var(--disp); font-style:var(--hub-logo-style, italic); font-weight:600; font-size:2.2rem; letter-spacing:-.03em; line-height:1; color:var(--logo); margin:0; }
    .logo .dot { font-style:normal; color:var(--accent); }
    .box { position:sticky; top:calc(8px + env(safe-area-inset-top)); z-index:2; }
    .box svg { position:absolute; left:16px; top:50%; translate:0 -50%; width:20px; height:20px; color:var(--dim); pointer-events:none; }
    #q { width:100%; font-size:1.1rem; padding:14px 16px 14px 46px; border-radius:14px; border:1px solid var(--line-strong); background:var(--surface); box-shadow:var(--shadow); outline:none; min-height:54px; }
    #q:focus { border-color:var(--accent); }
    .sources { font-size:.85rem; color:var(--dim); display:flex; flex-wrap:wrap; gap:2px 12px; }
    .sources .err { color:var(--danger); }
    .group h2 { margin:6px 2px 6px; font-family:var(--disp); font-style:var(--hub-logo-style, italic); font-weight:600; font-size:1rem; color:var(--c); }
    .group h2 .dot { font-style:normal; }
    .group h2 small { font-family:var(--body); font-style:normal; font-weight:600; color:var(--dim); font-size:.8rem; margin-left:6px; }
    .results { display:grid; gap:6px; }
    .hit { display:block; text-decoration:none; color:inherit; background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--c); border-radius:12px; padding:10px 14px; box-shadow:var(--shadow); }
    .hit:hover, .hit.sel { background:var(--hover); border-color:var(--c); }
    .hit .t { font-weight:600; overflow-wrap:anywhere; }
    .hit .s { font-size:.88rem; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    mark { background:var(--mark); color:inherit; border-radius:3px; padding:0 1px; }
    .empty { text-align:center; color:var(--muted); padding:28px 12px; font-family:var(--disp); font-style:italic; }
    .more { border:none; background:none; color:var(--muted); font:inherit; font-size:.88rem; font-weight:600; padding:4px 2px; cursor:pointer; }
    :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <main>
    <h1 class="logo">search<span class="dot">.</span></h1>
    <div class="box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Recipes, places, tasks, quotes…" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Search everything" autofocus>
    </div>
    <div class="sources" id="sources" aria-live="polite"></div>
    <div id="out"></div>
  </main>

  <script type="module">
    import { supabase, requireAuth } from "/lifeos/auth.js";
    await requireAuth();
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const read = (k) => { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch { return null; } };
    const fold = (s) => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
    const BASE = "https://dannywebb014.github.io";
    const words = (v) => (Array.isArray(v) ? v : [v]).flat().filter(x => x != null && x !== "").map(String).join(" ");

    // Each source: where its things live, and how each one looks as a result.
    // An entry is { title, sub, text (searched), href }.
    const SOURCES = [
      { id: "food", name: "food", load: async () => {
        const { data, error } = await supabase.from("recipes").select("id, name, cuisine, tags, ingredients, source").order("name");
        if (error) throw error;
        return data.map(r => ({ title: r.name, sub: [r.cuisine, (r.tags || []).slice(0, 3).join(", ")].filter(Boolean).join(" · "),
          text: words([r.name, r.cuisine, r.tags, r.source, (r.ingredients || []).map(i => i?.name)]), href: `${BASE}/foodhub/?recipe=${r.id}` }));
      } },
      { id: "places", name: "places", load: async () => {
        const { data, error } = await supabase.from("places_places").select("id, name, address, type_label, note, visit_note").order("name");
        if (error) throw error;
        return data.map(p => ({ title: p.name, sub: [p.type_label, p.address].filter(Boolean).join(" · "), text: words([p.name, p.address, p.type_label, p.note, p.visit_note]), href: `${BASE}/places/` }));
      } },
      { id: "tasks", name: "tasks", load: tasks },
      { id: "media", name: "media", load: async () => {
        const cache = read("media.cache");
        if (!cache?.collections) return [];
        return cache.collections.flatMap(c => (c.items || []).map(it => {
          const props = Object.values(it.props || {}).map(v => typeof v === "object" ? words(Object.values(v || {})) : v);
          return { title: it.title || "Untitled", sub: `${c.docTitle} · ${c.name}`, text: words([it.title, c.name, props, it.preview]),
            href: `${BASE}/mediahub/?col=${encodeURIComponent(c.id)}&item=${encodeURIComponent(it.id)}` };
        }));
      } },
      { id: "wish", name: "wish", load: async () => {
        const [i, p] = await Promise.all([
          supabase.from("wish_items").select("id, name, notes, url, person_id, status"),
          supabase.from("wish_people").select("id, name"),
        ]);
        if (i.error) throw i.error;
        const who = Object.fromEntries((p.data || []).map(x => [x.id, x.name]));
        return i.data.map(w => ({ title: w.name, sub: `${w.person_id ? `for ${who[w.person_id] || "someone"}` : "my wishlist"}${w.status !== "open" ? ` · ${w.status === "given" ? "given" : "got it"}` : ""}`,
          text: words([w.name, w.notes, w.url, who[w.person_id]]), href: `${BASE}/lifeos/wish/#${w.id}` }));
      } },
      { id: "motivation", name: "motivation", load: async () => {
        const { data, error } = await supabase.from("motivation_quotes").select("text, author");
        if (error) throw error;
        return data.map(q => ({ title: q.text, sub: q.author || "", text: words([q.text, q.author]), href: `${BASE}/motivation/` }));
      } },
      { id: "week", name: "week", load: async () => {
        const { data, error } = await supabase.from("week_reviews").select("week_start, went_well, didnt, next_three, rating").order("week_start", { ascending: false });
        if (error) throw error;
        return data.map(r => {
          const d = new Date(r.week_start + "T12:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
          return { title: `Week of ${d}${r.rating ? ` · ${r.rating}/10` : ""}`, sub: (r.went_well || r.next_three || "").split("\n")[0],
            text: words([r.went_well, r.didnt, r.next_three]), href: `${BASE}/lifeos/week/#${r.week_start}` };
        });
      } },
    ];

    // Open tasks from Craft (the connections saved in tasks.) and Todoist.
    async function tasks() {
      const settings = read("tasks.settings") || {};
      const out = [];
      const key = (k) => String(k || "").replace(/[\s ​-‍﻿]/g, "");
      const labels = { my: "my space.", work: "work." };
      await Promise.all(Object.entries(settings.spaces || {}).filter(([, s]) => s?.url).map(async ([id, s]) => {
        const m = String(s.url).match(/connect\.craft\.do\/links\/[^/?#\s]+/i);
        const base = m ? `https://${m[0]}/api/v1` : s.url.replace(/\/+$/, "");
        const headers = { Accept: "application/json" };
        if (key(s.key)) headers.Authorization = `Bearer ${key(s.key)}`;
        const seen = new Set();
        for (const scope of ["active", "upcoming", "inbox"]) {
          const res = await fetch(`${base}/tasks?scope=${scope}`, { headers });
          if (!res.ok) throw new Error(`Craft ${res.status}`);
          for (const t of (await res.json()).items || []) {
            if (t.taskInfo?.state !== "todo" || seen.has(t.id)) continue;
            seen.add(t.id);
            const text = String(t.markdown || "").replace(/^\s*[-*]\s*\[[ x]\]\s*/, "").trim();
            out.push({ title: text, sub: `${labels[id] || id}${t.taskInfo?.scheduleDate ? ` · ${t.taskInfo.scheduleDate}` : ""}`, text, href: `${BASE}/taskhub/` });
          }
        }
      }));
      const token = key(settings.todoist?.token);
      if (token) {
        const res = await fetch("https://api.todoist.com/api/v1/tasks?limit=200", { headers: { Authorization: `Bearer ${token}` } });
        if (!res.ok) throw new Error(`Todoist ${res.status}`);
        const body = await res.json();
        for (const t of body.results || body.items || []) out.push({ title: t.content, sub: `joint.${t.due?.date ? ` · ${t.due.date}` : ""}`, text: words([t.content, t.description]), href: `${BASE}/taskhub/` });
      }
      return out;
    }

    // ── Loading every source once; typing then filters instantly ──
    const index = {};       // source id → entries
    const status = {};      // source id → "n" or an error
    function paintSources() {
      $("sources").innerHTML = SOURCES.map(s => {
        const st = status[s.id];
        if (st === undefined) return `<span>${s.name}…</span>`;
        if (st instanceof Error) return `<span class="err" title="${esc(st.message)}">${s.name}: couldn’t load</span>`;
        return st ? `<span>${st} in ${s.name}</span>` : "";
      }).join("");
    }
    // ── Matching: every word must appear; title matches rank first ──
    const expanded = new Set();
    let flat = [], sel = -1;
    function highlight(text, terms) {
      let html = esc(text);
      for (const t of terms) {
        if (!t) continue;
        const i = fold(text).indexOf(t);
        if (i < 0) continue;
        // Folding can change lengths only for accented letters, so map back by position.
        const raw = text.slice(i, i + t.length);
        html = html.replace(esc(raw), `<mark>${esc(raw)}</mark>`);
      }
      return html;
    }
    // When a result matched on something not shown (a note, an ingredient), show those words instead.
    function why(e, terms) {
      const shown = fold(`${e.title} ${e.sub || ""}`);
      const hidden = terms.find(t => !shown.includes(t));
      if (!hidden) return e.sub;
      const i = fold(e.text).indexOf(hidden);
      if (i < 0) return e.sub;
      const start = Math.max(0, i - 30);
      return `${start ? "…" : ""}${e.text.slice(start, i + hidden.length + 40).trim()}…`;
    }
    function run() {
      const raw = $("q").value.trim();
      const terms = fold(raw).split(/\s+/).filter(Boolean);
      flat = []; sel = -1;
      if (!terms.length) { $("out").innerHTML = ""; return; }
      const groups = SOURCES.map(s => {
        const hits = (index[s.id] || []).filter(e => terms.every(t => e.f.includes(t)))
          .map(e => ({ e, score: (e.ft.startsWith(terms[0]) ? 0 : terms.every(t => e.ft.includes(t)) ? 1 : 2) }))
          .sort((a, b) => a.score - b.score || a.e.title.localeCompare(b.e.title)).map(x => x.e);
        return { s, hits };
      }).filter(g => g.hits.length)
        // The app whose best result matches the title best comes first.
        .sort((a, b) => (a.hits[0].ft.startsWith(terms[0]) ? 0 : 1) - (b.hits[0].ft.startsWith(terms[0]) ? 0 : 1));
      if (!groups.length) {
        const loading = SOURCES.some(s => status[s.id] === undefined);
        $("out").innerHTML = `<p class="empty">${loading ? "Still loading some apps…" : `Nothing matches “${esc(raw)}”.`}</p>`;
        return;
      }
      $("out").innerHTML = groups.map(({ s, hits }) => {
        const shown = expanded.has(s.id) ? hits : hits.slice(0, 5);
        const rows = shown.map(e => { flat.push(e); const sub = why(e, terms); return `<a class="hit" href="${esc(e.href)}" data-i="${flat.length - 1}"><div class="t">${highlight(e.title, terms)}</div>${sub ? `<div class="s">${highlight(sub, terms)}</div>` : ""}</a>`; }).join("");
        const more = hits.length > shown.length ? `<button type="button" class="more" data-more="${s.id}">Show all ${hits.length}</button>` : "";
        return `<section class="group" style="--c:var(--${s.id})"><h2>${s.name}<span class="dot">.</span><small>${hits.length}</small></h2><div class="results">${rows}</div>${more}</section>`;
      }).join("");
    }
    $("q").addEventListener("input", () => { expanded.clear(); run(); });
    $("out").addEventListener("click", (e) => { const b = e.target.closest("[data-more]"); if (b) { expanded.add(b.dataset.more); run(); } });

    // Arrow keys move through results; Enter opens; Escape clears.
    function select(i) {
      sel = Math.max(-1, Math.min(flat.length - 1, i));
      document.querySelectorAll(".hit").forEach(h => h.classList.toggle("sel", Number(h.dataset.i) === sel));
      document.querySelector(`.hit[data-i="${sel}"]`)?.scrollIntoView({ block: "nearest" });
    }
    $("q").addEventListener("keydown", (e) => {
      if (e.key === "ArrowDown") { e.preventDefault(); select(sel + 1); }
      else if (e.key === "ArrowUp") { e.preventDefault(); select(sel - 1); }
      else if (e.key === "Enter") { const h = flat[sel >= 0 ? sel : 0]; if (h) location.href = h.href; }
      else if (e.key === "Escape") { $("q").value = ""; run(); }
    });
    const q = new URLSearchParams(location.search).get("q");
    if (q) { $("q").value = q; run(); }
    $("q").focus();

    paintSources();
    // In the background: results appear as each app finishes loading.
    Promise.all(SOURCES.map(async (s) => {
      try { index[s.id] = (await s.load()).map(e => ({ ...e, f: fold(`${e.title} ${e.text}`), ft: fold(e.title) })); status[s.id] = index[s.id].length; }
      catch (err) {
        // A table that isn't set up yet (week., wish.) just means nothing to find there.
        const notSetUp = /does not exist|PGRST205|Could not find the table/i.test(`${err?.code} ${err?.message}`);
        if (!notSetUp) console.error(`${s.id}:`, err);
        status[s.id] = notSetUp ? 0 : err;
        index[s.id] = [];
      }
      paintSources();
      run();
    }));

  </script>
</body>
</html>
