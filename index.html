<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="lifeOS. — every app in one place" />
  <title>lifeOS.</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/lifeos/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="lifeOS.">
  <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1e1a" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="/lifeos/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@1,500;1,600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />

  <style>
    /* Same tokens as lifeOS. (myhub-homepage) */
    :root {
      --bg: #f4f1ea; --surface: #fffdf8; --hover: #f9f6ef;
      --line: #e5dfd0;
      --text: #2c2218; --muted: #6b6055;

      --life-logo: #5a4fa0;  --life-accent: #7d6fd6;
      --food-logo: #3d6b3d;  --food-accent: #4a7c4a;
      --train-logo: #8a3e25; --train-accent: #c45a3a;
      --breathe-logo: #8a5a14; --breathe-accent: #c08020;
      --motivation-logo: #2d5a90; --motivation-accent: #3d6ba8;
      --money-logo: #5a2c40; --money-accent: #7a3e5a;
      --tasks-logo: #1f5f5c; --tasks-accent: #2f8a84;
      --places-logo: #8f2f52; --places-accent: #b8436d;
      --cal-logo: #2f6aa3; --cal-accent: #3b7bbf;

      --disp: 'Lora', Georgia, serif;
      --body: 'Source Sans 3', system-ui, -apple-system, Helvetica, Arial, sans-serif;
      --bar: 3.25rem;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1e1a; --surface: #232823; --hover: #2a302a;
        --line: #3a423a;
        --text: #ebe8de; --muted: #a8a89c;
        --life-logo: #c9c1ff;  --life-accent: #b4a9ff;
        --food-logo: #9fc89f;  --food-accent: #5a8a5a;
        --train-logo: #e8a085; --train-accent: #d97a52;
        --breathe-logo: #e0b870; --breathe-accent: #e09d3a;
        --motivation-logo: #9fc0e0; --motivation-accent: #5a8ac2;
        --money-logo: #c89dc0; --money-accent: #a06080;
        --tasks-logo: #8fd0c9; --tasks-accent: #4fa8a0;
        --places-logo: #f0a8c4; --places-accent: #e0789f;
        --cal-logo: #a9cdf2; --cal-accent: #6fa8e0;
        color-scheme: dark;
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--body);
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
    }

    /* ── Frames ── */
    main { position: relative; flex: 1; min-height: 0; }
    iframe {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      border: 0; background: var(--bg);
      visibility: hidden;
    }
    iframe.on { visibility: visible; }

    /* ── Tab bar (bottom on phones, top on wider screens) ── */
    nav {
      order: 2;
      display: flex;
      align-items: stretch;
      background: var(--surface);
      border-top: 1px solid var(--line);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }
    .tabs {
      flex: 1;
      display: flex;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex: 0 0 auto;
      height: var(--bar);
      padding: 0 1rem;
      border: 0;
      background: none;
      cursor: pointer;
      font-family: var(--disp);
      font-style: italic;
      font-weight: 600;
      font-size: 1.05rem;
      color: var(--muted);
      position: relative;
      white-space: nowrap;
    }
    .tab .dot { font-style: normal; color: var(--accent); }
    .tab:hover { background: var(--hover); }
    .tab[aria-selected="true"] { color: var(--logo); }
    .tab[aria-selected="true"]::after {
      content: ""; position: absolute; left: 1rem; right: 1rem; top: 0;
      height: 3px; border-radius: 0 0 3px 3px; background: var(--accent);
    }
    .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -4px; }

    .pop {
      flex: 0 0 auto;
      width: var(--bar);
      height: var(--bar);
      display: grid; place-items: center;
      color: var(--muted);
      border-left: 1px solid var(--line);
      text-decoration: none;
      font-size: 1.1rem;
    }
    .pop:hover { background: var(--hover); color: var(--text); }

    @media (min-width: 760px) {
      nav { order: 0; border-top: 0; border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top); padding-bottom: 0; }
      .tab[aria-selected="true"]::after { top: auto; bottom: 0; border-radius: 3px 3px 0 0; }
    }
    @media (max-width: 759px) {
      main { padding-top: env(safe-area-inset-top); }
    }
  </style>
</head>
<body>
  <nav>
    <div class="tabs" role="tablist" aria-label="Apps" id="tabs"></div>
    <a class="pop" id="pop" target="_blank" rel="noopener" title="Open this app on its own" aria-label="Open this app on its own">↗</a>
  </nav>
  <main id="frames"></main>

  <script>
    // Each app stays where it is; this page only frames them.
    const APPS = [
      { id: 'life',       name: 'lifeOS',     url: 'https://dannywebb014.github.io/myhub-homepage/' },
      { id: 'food',       name: 'food',       url: 'https://food-hub-weld-five.vercel.app/' },
      { id: 'train',      name: 'train',      url: 'https://fitnesshub-woad.vercel.app/' },
      { id: 'breathe',    name: 'breathe',    url: 'https://dannywebb014.github.io/breathhub/' },
      { id: 'motivation', name: 'motivation', url: 'https://dannywebb014.github.io/motivation/' },
      { id: 'money',      name: 'money',      url: 'https://money-dannywebb014s-projects.vercel.app/' },
      { id: 'tasks',      name: 'tasks',      url: 'https://dannywebb014.github.io/taskhub/' },
      { id: 'cal',        name: 'calendar',   url: 'https://dannywebb014.github.io/calhub/' },
      { id: 'places',     name: 'places',     url: 'https://dannywebb014.github.io/places/' },
    ];

    const tabsEl = document.getElementById('tabs');
    const framesEl = document.getElementById('frames');
    const pop = document.getElementById('pop');
    const frames = {};

    for (const app of APPS) {
      const b = document.createElement('button');
      b.className = 'tab';
      b.id = 'tab-' + app.id;
      b.setAttribute('role', 'tab');
      b.style.setProperty('--logo', `var(--${app.id}-logo)`);
      b.style.setProperty('--accent', `var(--${app.id}-accent)`);
      b.innerHTML = `${app.name}<span class="dot">.</span>`;
      b.onclick = () => { location.hash = app.id; };
      tabsEl.append(b);
    }

    // Frames load on first visit, then stay alive so switching back keeps your place.
    function frameFor(app) {
      if (frames[app.id]) return frames[app.id];
      const f = document.createElement('iframe');
      f.src = app.url;
      f.title = app.name + '.';
      f.allow = 'geolocation; microphone; camera; clipboard-read; clipboard-write; fullscreen';
      f.addEventListener('load', () => catchAppLinks(f));
      framesEl.append(f);
      return frames[app.id] = f;
    }

    // lifeOS. is on the same origin, so its app cards can switch tabs here
    // instead of opening a new browser tab. lifeOS. itself is untouched.
    function catchAppLinks(f) {
      let doc;
      try { doc = f.contentDocument; } catch { return; }
      if (!doc) return;
      doc.addEventListener('click', e => {
        const a = e.target.closest && e.target.closest('a[href]');
        if (!a) return;
        const app = APPS.find(x => a.href.startsWith(x.url));
        if (!app || app.id === 'life') return;
        e.preventDefault();
        location.hash = app.id;
      }, true);
    }

    function show() {
      const id = location.hash.slice(1);
      const app = APPS.find(x => x.id === id) || APPS[0];
      const f = frameFor(app);
      for (const x of Object.values(frames)) x.classList.toggle('on', x === f);
      for (const b of tabsEl.children) {
        const on = b.id === 'tab-' + app.id;
        b.setAttribute('aria-selected', on);
        if (on) b.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      }
      pop.href = app.url;
      document.title = app.id === 'life' ? 'lifeOS.' : `${app.name}. · lifeOS.`;
    }

    addEventListener('hashchange', show);
    show();
  </script>
</body>
</html>
