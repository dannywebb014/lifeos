<div class="page">  <div class="glow" aria-hidden="true"></div>
  <div class="shell" id="shell" data-view="list">
    <aside class="side" aria-label="Notes">
      <header class="side-head">
        <h1 class="logo">notes<span class="dot">.</span></h1>
        <button type="button" class="icon-btn" id="bin-btn" aria-label="Bin" title="Bin">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>
        </button>
      </header>
      <div id="lists">
        <nav class="tabs" id="tabs" aria-label="Spaces">
          <button type="button" class="tab" data-space="my">my space</button>
          <button type="button" class="tab" data-space="work">work</button>
          <button type="button" class="tab" data-space="joint">joint</button>
        </nav>
        <div class="crumbs-bar">
          <nav class="crumbs" id="crumbs" aria-label="Folder"></nav>
          <button type="button" class="small-btn" id="new-folder" title="New folder">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 11v5M9.5 13.5h5"/></svg>Folder
          </button>
        </div>
        <div class="folder-tools" id="folder-tools" hidden>
          <button type="button" class="small-btn" data-act="rename">Rename</button>
          <button type="button" class="small-btn" data-act="move">Move</button>
          <button type="button" class="small-btn danger" data-act="delete">Delete folder</button>
        </div>
        <div id="notice"></div>
        <div class="list" id="list"></div>
      </div>
      <section id="bin" hidden aria-labelledby="bin-title">
        <button type="button" class="link" id="bin-back">‹ Back to notes</button>
        <h2 id="bin-title">Bin</h2>
        <p class="note">Deleted notes stay here for 30 days, then go for good.</p>
        <div class="list" id="bin-list"></div>
      </section>
    </aside>

    <section class="note-view" aria-label="Note">
      <p class="empty-state" id="empty">Pick a note, or start a new one.</p>
      <article id="note" hidden>
        <div class="note-bar">
          <button type="button" class="back" id="back" aria-label="Back to notes">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg><span id="back-label">notes</span>
          </button>
          <span class="status" id="status" role="status" aria-live="polite"></span>
          <button type="button" class="icon-btn" id="move" aria-label="Move to a folder or space" title="Move">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M10 13h6M13.5 10.5 16 13l-2.5 2.5"/></svg>
          </button>
          <button type="button" class="icon-btn" id="delete" aria-label="Move to the bin" title="Move to the bin">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>
          </button>
        </div>
        <textarea id="title" class="title" rows="1" placeholder="Untitled" aria-label="Title" autocapitalize="sentences"></textarea>
        <div class="card">
          <div class="toolbar" id="toolbar" role="toolbar" aria-label="Formatting">
            <button type="button" data-cmd="h1" aria-label="Heading" title="Heading">H1</button>
            <button type="button" data-cmd="h2" aria-label="Smaller heading" title="Smaller heading">H2</button>
            <button type="button" data-cmd="bold" aria-label="Bold" title="Bold (⌘B)"><b>B</b></button>
            <button type="button" data-cmd="italic" aria-label="Italic" title="Italic (⌘I)"><i>I</i></button>
            <span class="sep" aria-hidden="true"></span>
            <button type="button" data-cmd="checks" aria-label="Checklist" title="Checklist">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="6" height="6" rx="1.5"/><path d="m4.5 7 1 1 2-2"/><rect x="3" y="14" width="6" height="6" rx="1.5"/><path d="M13 7h8M13 17h8"/></svg>
            </button>
            <button type="button" data-cmd="bullets" aria-label="Bullet list" title="Bullet list">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1" fill="currentColor"/><circle cx="4.5" cy="12" r="1" fill="currentColor"/><circle cx="4.5" cy="18" r="1" fill="currentColor"/></svg>
            </button>
            <button type="button" data-cmd="numbers" aria-label="Numbered list" title="Numbered list">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 6h10M10 12h10M10 18h10"/><path d="M4 5h1.5v4M4 9h3M4 14.5c.5-.7 2.8-.9 2.8.6 0 1.2-2.8 2-2.8 2.9h3" stroke-width="1.5"/></svg>
            </button>
            <button type="button" data-cmd="mic" id="mic" aria-label="Speak" title="Speak" aria-pressed="false" hidden>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
            </button>
            <span class="sep" aria-hidden="true"></span>
            <button type="button" data-cmd="undo" aria-label="Undo" title="Undo (⌘Z)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>
            </button>
            <button type="button" data-cmd="redo" aria-label="Redo" title="Redo (⇧⌘Z)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg>
            </button>
          </div>
          <p class="interim" id="interim" hidden></p>
          <div id="editor" class="editor"></div>
        </div>
        <p class="hint">Type <kbd>/</kbd> for headings, lists, quotes, code and dividers.</p>
      </article>
    </section>
  </div>

  <button type="button" class="fab" id="add" aria-label="New note" title="New note (N)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>
  <div class="slash" id="slash" role="listbox" aria-label="Add a block" hidden></div>

  <dialog id="name-dlg" aria-labelledby="name-title">
    <form class="sheet" id="name-form" method="dialog">
      <h2 id="name-title">New folder</h2>
      <input id="name-input" type="text" maxlength="200" placeholder="Folder name" autocomplete="off" aria-labelledby="name-title">
      <div class="row">
        <button type="button" class="ghost" id="name-cancel">Cancel</button>
        <button type="submit" class="primary" id="name-ok">Make folder</button>
      </div>
    </form>
  </dialog>

  <dialog id="move-dlg" aria-labelledby="move-title">
    <div class="sheet">
      <h2 id="move-title">Move to</h2>
      <div class="dest" id="move-list"></div>
      <div class="row"><button type="button" class="ghost" id="move-cancel">Cancel</button></div>
    </div>
  </dialog>
</div>
